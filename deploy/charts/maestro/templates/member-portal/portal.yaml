{{- /*
The sample business application whose incident we investigate (ADR-0013). One image, three commands.
portal-api is fronted by the edge gateway, caches in Valkey and publishes to Kafka; portal-consumer
reads the topic (scaled to 0 by the messaging-lag scenario); loadgen drives the public API continuously.
*/ -}}
{{- $img := printf "%s:%s" .Values.images.memberPortal.repository .Values.images.memberPortal.tag -}}
{{- $env := list
  (dict "name" "VALKEY_URL" "value" "redis://valkey.domain-cache:6379")
  (dict "name" "KAFKA_BOOTSTRAP" "value" "kafka.domain-messaging:9092")
  (dict "name" "KAFKA_TOPIC" "value" .Values.kafka.topic)
  (dict "name" "KAFKA_CONSUMER_GROUP" "value" .Values.kafka.consumerGroup)
  (dict "name" "EDGE_URL" "value" "http://edge-gateway.domain-apim")
  (dict "name" "FLEET_EVENTS_URL" "value" "http://fleet-console.maestro:8080/api/events")
  (dict "name" "LOG_LEVEL" "value" "info") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-api
  namespace: member-portal
  labels: { app: portal-api, maestro.io/app: member-portal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: portal-api }
  template:
    metadata:
      labels: { app: portal-api, maestro.io/app: member-portal }
    spec:
      containers:
        - name: api
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["portal-api"]
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: SERVICE_NAME, value: portal-api }
            {{- range $env }}
            - { name: {{ .name }}, value: {{ .value | quote }} }
            {{- end }}
          {{- include "maestro.httpProbes" 8000 | nindent 10 }}
          resources: {{ toYaml .Values.resources.portal | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: portal-api
  namespace: member-portal
  labels: { app: portal-api }
spec:
  selector: { app: portal-api }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portal-api
  namespace: member-portal
  labels: { app: portal-api }
spec:
  selector:
    matchLabels: { app: portal-api }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-consumer
  namespace: member-portal
  labels: { app: portal-consumer, maestro.io/app: member-portal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: portal-consumer }
  template:
    metadata:
      labels: { app: portal-consumer, maestro.io/app: member-portal }
    spec:
      initContainers:
        - name: wait-for-kafka
          image: {{ .Values.thirdParty.busybox | quote }}
          command: ["sh", "-c", "until nc -z kafka.domain-messaging 9092; do sleep 3; done"]
      containers:
        - name: consumer
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["portal-consumer"]
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: SERVICE_NAME, value: portal-consumer }
            {{- range $env }}
            - { name: {{ .name }}, value: {{ .value | quote }} }
            {{- end }}
          {{- include "maestro.httpProbes" 8000 | nindent 10 }}
          resources: {{ toYaml .Values.resources.portal | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: portal-consumer
  namespace: member-portal
  labels: { app: portal-consumer }
spec:
  selector: { app: portal-consumer }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portal-consumer
  namespace: member-portal
  labels: { app: portal-consumer }
spec:
  selector:
    matchLabels: { app: portal-consumer }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: member-portal
  labels: { app: loadgen, maestro.io/app: member-portal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen, maestro.io/app: member-portal }
    spec:
      containers:
        - name: loadgen
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["loadgen"]
          env:
            - { name: SERVICE_NAME, value: loadgen }
            - { name: LOADGEN_RPS, value: "5" }
            {{- range $env }}
            - { name: {{ .name }}, value: {{ .value | quote }} }
            {{- end }}
          resources: {{ toYaml .Values.resources.portal | nindent 12 }}
