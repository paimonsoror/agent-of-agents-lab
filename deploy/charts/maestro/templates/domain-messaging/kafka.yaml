{{- /* Messaging platform: Apache Kafka 4 in KRaft combined mode, single node, plus kafka-exporter (ADR-0013). */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: domain-messaging
  labels: { app: kafka, maestro.io/platform: messaging }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka, maestro.io/platform: messaging }
    spec:
      containers:
        - name: kafka
          image: {{ .Values.thirdParty.kafka | quote }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.domain-messaging:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "2" }
            - { name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heapOpts | quote }} }
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          readinessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources: {{ toYaml .Values.resources.kafka | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: domain-messaging
  labels: { app: kafka }
spec:
  selector: { app: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: domain-messaging
  labels: { app: kafka-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-exporter }
  template:
    metadata:
      labels: { app: kafka-exporter }
    spec:
      initContainers:
        - name: wait-for-kafka
          image: {{ .Values.thirdParty.busybox | quote }}
          command: ["sh", "-c", "until nc -z kafka.domain-messaging 9092; do echo waiting for kafka; sleep 3; done"]
      containers:
        - name: exporter
          image: {{ .Values.thirdParty.kafkaExporter | quote }}
          args:
            - --kafka.server=kafka.domain-messaging:9092
            - --web.listen-address=:9308
          ports:
            - { name: metrics, containerPort: 9308 }
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          resources: {{ toYaml .Values.resources.exporter | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: domain-messaging
  labels: { app: kafka-exporter }
spec:
  selector: { app: kafka-exporter }
  ports:
    - { name: metrics, port: 9308, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  namespace: domain-messaging
  labels: { app: kafka-exporter }
spec:
  selector:
    matchLabels: { app: kafka-exporter }
  endpoints:
    - port: metrics
      interval: 15s
