{{- /*
Fleet gateway: agentgateway v1.6.0 (ADR-0003). Config shape verified against the real binary on
2026-10-15: routing-based mode (`gateways` + top-level `routes`), `ui.gateways: default` serves the
admin UI at /ui on the gateway port, `pathPrefix` matches, MCP backend with multiplexed `targets[].mcp.host`,
route-level `jwtAuth` (strict) + `backendAuth.passthrough` + `mcpAuthorization` CEL rules.
Unauthenticated requests get 401; metrics are on :15020 (not the gateway port).
The binary EXITS if the JWKS URL cannot be fetched at start, hence the init container that waits for Keycloak.
*/ -}}
{{- $issuer := include "maestro.issuer" . -}}
{{- $jwks := include "maestro.jwksUrl" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-gateway-config
  namespace: maestro-gateway
  labels: { app: fleet-gateway }
data:
  config.yaml: |
    config:
      logging:
        format: json
    gateways:
      default:
        port: 4000
    ui:
      gateways: default
    routes:
    - name: domain-agents
      matches:
      - path:
          pathPrefix: /agents/mcp
      policies:
        cors:
          allowOrigins: ["*"]
          allowHeaders: [mcp-protocol-version, content-type, cache-control, mcp-session-id, authorization]
          exposeHeaders: [Mcp-Session-Id]
        jwtAuth:
          mode: strict
          issuer: {{ $issuer }}
          # A direct caller's token is addressed to the gateway; Maestro's on-behalf-of tokens are addressed
          # to exactly one agent (ADR-0015). Any one of these audiences satisfies the gateway; the agent
          # behind the target then insists on its own name.
          audiences: [maestro-gateway, apim-agent, cache-agent, messaging-agent]
          jwks:
            url: {{ $jwks }}
        backendAuth:
          passthrough: {}
        # A domain-agent assessment is an LLM investigation (typically 20-90 s); the gateway's
        # default upstream timeout (~10 s) would cut it off. Budget generously; Maestro has its own limits.
        timeout:
          requestTimeout: 600s
          backendRequestTimeout: 600s
        # Role-based: an on-behalf-of token carries only the one domain role Keycloak scoped it to, so a
        # token minted for cache-agent cannot list or call apim tools even before reaching the agent.
        mcpAuthorization:
          rules:
          - 'mcp.tool.target == "apim" && "domain:apim" in jwt.realm_access.roles'
          - 'mcp.tool.target == "cache" && "domain:cache" in jwt.realm_access.roles'
          - 'mcp.tool.target == "messaging" && "domain:messaging" in jwt.realm_access.roles'
      backends:
      - mcp:
          targets:
          - name: apim
            mcp:
              host: http://apim-agent.domain-apim:8000/mcp
          - name: cache
            mcp:
              host: http://cache-agent.domain-cache:8000/mcp
          - name: messaging
            mcp:
              host: http://messaging-agent.domain-messaging:8000/mcp
    {{- /* One route per agent for Maestro's delegated calls (ADR-0015): an on-behalf-of token is addressed to a
           single agent, and the multiplexed route above would open a session with every target, so the other
           agents would (rightly) refuse it. Direct callers keep using the multiplexed /agents/mcp. */}}
    {{- range $d := list "apim" "cache" "messaging" }}
    - name: agent-{{ $d }}
      matches:
      - path:
          pathPrefix: /agents/{{ $d }}/mcp
      policies:
        cors:
          allowOrigins: ["*"]
          allowHeaders: [mcp-protocol-version, content-type, cache-control, mcp-session-id, authorization]
          exposeHeaders: [Mcp-Session-Id]
        jwtAuth:
          mode: strict
          issuer: {{ $issuer }}
          audiences: [{{ $d }}-agent, maestro-gateway]
          jwks:
            url: {{ $jwks }}
        backendAuth:
          passthrough: {}
        timeout:
          requestTimeout: 600s
          backendRequestTimeout: 600s
        mcpAuthorization:
          rules:
          - '"domain:{{ $d }}" in jwt.realm_access.roles'
      backends:
      - mcp:
          targets:
          - name: {{ $d }}
            mcp:
              host: http://{{ $d }}-agent.domain-{{ $d }}:8000/mcp
    {{- end }}
    - name: maestro
      matches:
      - path:
          pathPrefix: /maestro/mcp
      policies:
        cors:
          allowOrigins: ["*"]
          allowHeaders: [mcp-protocol-version, content-type, cache-control, mcp-session-id, authorization]
          exposeHeaders: [Mcp-Session-Id]
        jwtAuth:
          mode: strict
          issuer: {{ $issuer }}
          audiences: [maestro-gateway, maestro]
          jwks:
            url: {{ $jwks }}
        backendAuth:
          passthrough: {}
        # A domain-agent assessment is an LLM investigation (typically 20-90 s); the gateway's
        # default upstream timeout (~10 s) would cut it off. Budget generously; Maestro has its own limits.
        timeout:
          requestTimeout: 600s
          backendRequestTimeout: 600s
        mcpAuthorization:
          rules:
          - '"maestro:ask" in jwt.realm_access.roles'
      backends:
      - mcp:
          targets:
          - name: maestro
            mcp:
              host: http://maestro.maestro:8000/mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-gateway
  namespace: maestro-gateway
  labels: { app: fleet-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fleet-gateway }
  template:
    metadata:
      labels: { app: fleet-gateway }
      annotations:
        # Includes the realm: Keycloak re-imports into a fresh in-memory DB on every realm change and mints new
        # signing keys, and agentgateway only fetches JWKS at start. Rolling the gateway with the realm (its init
        # container waits for the new JWKS) keeps the keys in step (ADR-0015).
        checksum/config: {{ printf "%s%s%s%s" $issuer $jwks "aud-v2" (.Values.keycloak.realmJson | sha256sum) | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: {{ .Values.thirdParty.busybox | quote }}
          command: ["sh", "-c", "until wget -qO- {{ $jwks }} >/dev/null 2>&1; do echo waiting for keycloak jwks; sleep 3; done"]
      containers:
        - name: agentgateway
          image: {{ .Values.thirdParty.agentgateway | quote }}
          args: ["-f", "/config/config.yaml"]
          ports:
            - { name: http, containerPort: 4000 }
            - { name: metrics, containerPort: 15020 }
            - { name: readiness, containerPort: 15021 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz/ready, port: readiness }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz/ready, port: readiness }
            periodSeconds: 30
          resources: {{ toYaml .Values.resources.gateway | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: fleet-gateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-gateway
  namespace: maestro-gateway
  labels: { app: fleet-gateway }
spec:
  type: NodePort
  selector: { app: fleet-gateway }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: {{ .Values.ports.fleetGateway }} }
    - { name: metrics, port: 15020, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fleet-gateway
  namespace: maestro-gateway
  labels: { app: fleet-gateway }
spec:
  selector:
    matchLabels: { app: fleet-gateway }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
