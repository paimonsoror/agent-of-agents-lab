{{- /* The Anthropic key, in every namespace that runs an LLM loop. Value comes from --set-string at deploy time. */ -}}
{{- if not .Values.anthropicApiKey }}
{{- fail "anthropicApiKey is empty: scripts/up.sh reads it from ~/.maestro/secrets.env (ANTHROPIC_API_KEY=...)" }}
{{- end }}
{{- range list "maestro" "domain-apim" "domain-cache" "domain-messaging" }}
apiVersion: v1
kind: Secret
metadata:
  name: anthropic
  namespace: {{ . }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ $.Values.anthropicApiKey | quote }}
---
{{- end }}
