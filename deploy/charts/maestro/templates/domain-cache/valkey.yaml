{{- /* Distributed-cache platform: Valkey with a deliberately small maxmemory, plus redis_exporter (ADR-0013). */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: domain-cache
  labels: { app: valkey, maestro.io/platform: cache }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey, maestro.io/platform: cache }
    spec:
      containers:
        - name: valkey
          image: {{ .Values.thirdParty.valkey | quote }}
          args:
            - valkey-server
            - --maxmemory
            - {{ .Values.valkey.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.valkey.maxmemoryPolicy | quote }}
            - --save
            - ""
            - --appendonly
            - "no"
            - --slowlog-log-slower-than
            - "1000"
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 30
          resources: {{ toYaml .Values.resources.valkey | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: domain-cache
  labels: { app: valkey }
spec:
  selector: { app: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: valkey }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-exporter
  namespace: domain-cache
  labels: { app: valkey-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: valkey-exporter }
  template:
    metadata:
      labels: { app: valkey-exporter }
    spec:
      containers:
        - name: exporter
          image: {{ .Values.thirdParty.redisExporter | quote }}
          env:
            - { name: REDIS_ADDR, value: "redis://valkey.domain-cache:6379" }
          ports:
            - { name: metrics, containerPort: 9121 }
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          resources: {{ toYaml .Values.resources.exporter | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-exporter
  namespace: domain-cache
  labels: { app: valkey-exporter }
spec:
  selector: { app: valkey-exporter }
  ports:
    - { name: metrics, port: 9121, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey-exporter
  namespace: domain-cache
  labels: { app: valkey-exporter }
spec:
  selector:
    matchLabels: { app: valkey-exporter }
  endpoints:
    - port: metrics
      interval: 15s
